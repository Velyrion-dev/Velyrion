[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "velyrion"
version = "1.0.0"
description = "AI Agent Governance SDK — Monitor, control, and audit every AI agent action. 21+ framework integrations."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "VELYRION", email = "hello@velyrion.com"}]
keywords = ["ai", "agent", "governance", "monitoring", "audit", "llm", "safety", "openai", "langchain", "anthropic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
langgraph = ["langgraph>=0.0.1"]
llamaindex = ["llama-index>=0.10.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
gemini = ["google-generativeai>=0.5.0"]
vertexai = ["google-cloud-aiplatform>=1.38.0"]
mistral = ["mistralai>=0.1.0"]
cohere = ["cohere>=5.0.0"]
crewai = ["crewai>=0.28.0"]
autogen = ["pyautogen>=0.2.0"]
haystack = ["haystack-ai>=2.0.0"]
pydanticai = ["pydantic-ai>=0.0.1"]
huggingface = ["transformers>=4.30.0"]
ollama = ["ollama>=0.1.0"]
bedrock = ["boto3>=1.28.0"]
azure = ["openai>=1.0.0"]
async = ["httpx>=0.27.0"]
all = [
    "langchain>=0.1.0", "openai>=1.0.0", "anthropic>=0.18.0",
    "google-generativeai>=0.5.0", "mistralai>=0.1.0", "cohere>=5.0.0",
    "crewai>=0.28.0", "pyautogen>=0.2.0", "httpx>=0.27.0",
    "ollama>=0.1.0", "boto3>=1.28.0",
]

[project.scripts]
velyrion = "velyrion.cli:main"

[project.urls]
Homepage = "https://velyrion.com"
Documentation = "https://velyrion.com/docs"
Repository = "https://github.com/Velyrion-dev/Velyrion"
"Bug Tracker" = "https://github.com/Velyrion-dev/Velyrion/issues"
Changelog = "https://github.com/Velyrion-dev/Velyrion/releases"
