name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes — Render sleeps after 15min
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl -sf https://velyrion.onrender.com/health && echo "Backend is healthy!" || echo "Backend sleeping, sending wake request..."
